<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>portfolio-v3</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages)
      // Keeps the "/portfolio-v3" segment, encodes the rest of the path into a
      // query string, then redirects to index.html so React Router can take over.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
